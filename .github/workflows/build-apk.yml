name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Installer les composants natifs Tikowiko
        run: |
          mkdir -p android/app/src/main/java/com/tikowiko/intelligent
          mkdir -p android/app/src/main/res/xml
          cp android-plugin/AppLauncherPlugin.java android/app/src/main/java/com/tikowiko/intelligent/AppLauncherPlugin.java
          cp android-plugin/DirectCallPlugin.java android/app/src/main/java/com/tikowiko/intelligent/DirectCallPlugin.java
          cp android-plugin/ClapDetectionService.java android/app/src/main/java/com/tikowiko/intelligent/ClapDetectionService.java
          cp android-plugin/TikowikoVoiceInteractionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionService.java
          cp android-plugin/TikowikoVoiceInteractionSessionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSessionService.java
          cp android-plugin/TikowikoVoiceInteractionSession.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSession.java
          cp android-plugin/TikowikoRecognitionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoRecognitionService.java
          cp android-plugin/voice_interaction_service.xml android/app/src/main/res/xml/voice_interaction_service.xml
          cp android-plugin/MainActivity-snippet.java android/app/src/main/java/com/tikowiko/intelligent/MainActivity.java

      - name: Ajouter les permissions et les services Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.CALL_PHONE" />',
              '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + '\n\n    <application', 1)

          clap_service = '''        <service
              android:name=".ClapDetectionService"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="microphone" />\n'''

          if 'android:name=".ClapDetectionService"' not in text:
              text = text.replace('    </application>', clap_service + '    </application>', 1)

          assistant_services = '''        <service
              android:name=".TikowikoVoiceInteractionService"
              android:permission="android.permission.BIND_VOICE_INTERACTION"
              android:exported="true">
              <intent-filter>
                  <action android:name="android.service.voice.VoiceInteractionService" />
              </intent-filter>
              <meta-data
                  android:name="android.voice_interaction"
                  android:resource="@xml/voice_interaction_service" />
          </service>

          <service
              android:name=".TikowikoVoiceInteractionSessionService"
              android:permission="android.permission.BIND_VOICE_INTERACTION"
              android:exported="true"
              android:process=":voice_session" />

          <service
              android:name=".TikowikoRecognitionService"
              android:permission="android.permission.BIND_SPEECH_RECOGNITION_SERVICE"
              android:exported="true">
              <intent-filter>
                  <action android:name="android.speech.RecognitionService" />
              </intent-filter>
          </service>\n'''

          if 'android:name=".TikowikoVoiceInteractionService"' not in text:
              text = text.replace('    </application>', assistant_services + '    </application>', 1)

          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Installer les visuels Tikowiko sans retouche
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          icon = Path('android-assets/tikowiko-icon.jpg')
          splash = Path('android-assets/tikowiko-splash.jpg')
          if not icon.exists() or not splash.exists():
              raise SystemExit('Les images exactes Tikowiko ne sont pas encore présentes dans android-assets/')

          res = Path('android/app/src/main/res')
          density_folders = ['mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']
          for folder in ['drawable', 'drawable-port', 'drawable-nodpi', 'mipmap-anydpi-v26', *density_folders]:
              (res / folder).mkdir(parents=True, exist_ok=True)

          # Supprime les ressources générées par défaut qui empêchent Android d'utiliser
          # les visuels Tikowiko. Les images source sont copiées sans retouche.
          for folder in density_folders:
              for suffix in ['png', 'webp', 'jpg']:
                  for stem in ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground']:
                      path = res / folder / f'{stem}.{suffix}'
                      if path.exists():
                          path.unlink()

          for path in [
              res / 'drawable' / 'splash.png',
              res / 'drawable-port' / 'splash.png',
              res / 'drawable' / 'splash.jpg',
              res / 'drawable-port' / 'splash.jpg',
              res / 'mipmap-anydpi-v26' / 'ic_launcher.xml',
              res / 'mipmap-anydpi-v26' / 'ic_launcher_round.xml',
          ]:
              if path.exists():
                  path.unlink()

          # Copie exacte des deux fichiers fournis.
          shutil.copyfile(icon, res / 'drawable-nodpi' / 'tikowiko_icon.jpg')
          shutil.copyfile(splash, res / 'drawable-nodpi' / 'tikowiko_splash.jpg')

          # Icône classique : référence vers l'image exacte, sans redimensionnement généré.
          for folder in density_folders:
              (res / folder / 'ic_launcher.xml').write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<bitmap xmlns:android="http://schemas.android.com/apk/res/android" '
                  'android:src="@drawable/tikowiko_icon" android:gravity="center" />\n',
                  encoding='utf-8'
              )
              (res / folder / 'ic_launcher_round.xml').write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<bitmap xmlns:android="http://schemas.android.com/apk/res/android" '
                  'android:src="@drawable/tikowiko_icon" android:gravity="center" />\n',
                  encoding='utf-8'
              )

          # Icône adaptative Android 8+ : garde le visuel exact comme foreground.
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/tikowiko_icon" />
          </adaptive-icon>\n'''
          (res / 'mipmap-anydpi-v26' / 'ic_launcher.xml').write_text(adaptive, encoding='utf-8')
          (res / 'mipmap-anydpi-v26' / 'ic_launcher_round.xml').write_text(adaptive, encoding='utf-8')

          # Écran de démarrage plein écran basé directement sur l'image fournie.
          splash_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
              <item>
                  <bitmap android:src="@drawable/tikowiko_splash" android:gravity="fill" />
              </item>
          </layer-list>\n'''
          (res / 'drawable' / 'splash.xml').write_text(splash_xml, encoding='utf-8')
          (res / 'drawable-port' / 'splash.xml').write_text(splash_xml, encoding='utf-8')

          # Android 12+ : force le thème de lancement à utiliser Tikowiko.
          for values_dir in [res / 'values', res / 'values-v31']:
              values_dir.mkdir(parents=True, exist_ok=True)
              styles = values_dir / 'styles.xml'
              if not styles.exists():
                  continue
              text = styles.read_text(encoding='utf-8')
              text = text.replace('@drawable/splash', '@drawable/splash')
              styles.write_text(text, encoding='utf-8')
          PY

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Préparer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Tikowikointelligent-debug.apk

      - name: Publier l'APK dans la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create apk-latest \
            dist/Tikowikointelligent-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tikowikointelligent — APK" \
            --notes "Dernière version APK debug de Tikowikointelligent, générée automatiquement par GitHub Actions."
