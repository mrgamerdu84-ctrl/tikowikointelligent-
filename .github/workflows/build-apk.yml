name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Install Tikowiko native components
        run: |
          mkdir -p android/app/src/main/java/com/tikowiko/intelligent
          mkdir -p android/app/src/main/res/xml
          cp android-plugin/AppLauncherPlugin.java android/app/src/main/java/com/tikowiko/intelligent/AppLauncherPlugin.java
          cp android-plugin/DirectCallPlugin.java android/app/src/main/java/com/tikowiko/intelligent/DirectCallPlugin.java
          cp android-plugin/ActivityPointsPlugin.java android/app/src/main/java/com/tikowiko/intelligent/ActivityPointsPlugin.java
          cp android-plugin/ClapDetectionService.java android/app/src/main/java/com/tikowiko/intelligent/ClapDetectionService.java
          cp android-plugin/WhistleDetectionService.java android/app/src/main/java/com/tikowiko/intelligent/WhistleDetectionService.java
          cp android-plugin/WhistlePlugin.java android/app/src/main/java/com/tikowiko/intelligent/WhistlePlugin.java
          cp android-plugin/TikowikoVoiceInteractionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionService.java
          cp android-plugin/TikowikoVoiceInteractionSessionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSessionService.java
          cp android-plugin/TikowikoVoiceInteractionSession.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSession.java
          cp android-plugin/TikowikoRecognitionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoRecognitionService.java
          cp android-plugin/voice_interaction_service.xml android/app/src/main/res/xml/voice_interaction_service.xml
          cp android-plugin/MainActivity-snippet.java android/app/src/main/java/com/tikowiko/intelligent/MainActivity.java

      - name: Patch Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.CALL_PHONE" />',
              '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + '\n\n    <application', 1)
          whistle_service = '''        <service
              android:name=".WhistleDetectionService"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="microphone" />\n'''
          if 'android:name=".WhistleDetectionService"' not in text:
              text = text.replace('    </application>', whistle_service + '    </application>', 1)
          assistant_services = '''        <service
              android:name=".TikowikoVoiceInteractionService"
              android:permission="android.permission.BIND_VOICE_INTERACTION"
              android:exported="true">
              <intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter>
              <meta-data android:name="android.voice_interaction" android:resource="@xml/voice_interaction_service" />
          </service>
          <service android:name=".TikowikoVoiceInteractionSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true" android:process=":voice_session" />
          <service android:name=".TikowikoRecognitionService" android:permission="android.permission.BIND_SPEECH_RECOGNITION_SERVICE" android:exported="true">
              <intent-filter><action android:name="android.speech.RecognitionService" /></intent-filter>
          </service>\n'''
          if 'android:name=".TikowikoVoiceInteractionService"' not in text:
              text = text.replace('    </application>', assistant_services + '    </application>', 1)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install activity UI correction
        run: |
          test -s www/activity-ui-fix.js
          test -s android/app/src/main/assets/public/activity-ui-fix.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/public/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="activity-ui-fix.js"></script>'
          if marker not in text:
              if '</body>' in text:
                  text = text.replace('</body>', marker + '</body>', 1)
              else:
                  text += marker
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install Tikowiko web robot
        run: |
          test -s www/file_000000008d508246bb9118a8f3a93dc8.png
          test -s android/app/src/main/assets/public/file_000000008d508246bb9118a8f3a93dc8.png

      - name: Install Tikowiko visuals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          icon = Path('android-assets/tikowiko-icon.jpg')
          splash = Path('android-assets/tikowiko-splash.jpg')
          if not icon.exists() or not splash.exists():
              raise SystemExit('Visuels Tikowiko absents')
          res = Path('android/app/src/main/res')
          densities = ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']
          for folder in ['drawable','drawable-port','drawable-nodpi','mipmap-anydpi-v26',*densities]:
              (res / folder).mkdir(parents=True, exist_ok=True)
          for folder in densities:
              for stem in ['ic_launcher','ic_launcher_round','ic_launcher_foreground']:
                  for suffix in ['png','webp','jpg','xml']:
                      p = res / folder / f'{stem}.{suffix}'
                      if p.exists(): p.unlink()
          for p in [res/'mipmap-anydpi-v26/ic_launcher.xml', res/'mipmap-anydpi-v26/ic_launcher_round.xml', res/'drawable/splash.png', res/'drawable-port/splash.png']:
              if p.exists(): p.unlink()
          shutil.copyfile(icon, res/'drawable-nodpi/tikowiko_icon.jpg')
          shutil.copyfile(splash, res/'drawable-nodpi/tikowiko_splash.jpg')
          legacy = '''<?xml version="1.0" encoding="utf-8"?><bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/tikowiko_icon" android:gravity="center"/>'''
          for folder in densities:
              (res/folder/'ic_launcher.xml').write_text(legacy, encoding='utf-8')
              (res/folder/'ic_launcher_round.xml').write_text(legacy, encoding='utf-8')
          (res/'drawable/tikowiko_icon_foreground.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/tikowiko_icon" android:inset="12%"/>''', encoding='utf-8')
          adaptive = '''<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@drawable/tikowiko_icon_foreground"/></adaptive-icon>'''
          (res/'mipmap-anydpi-v26/ic_launcher.xml').write_text(adaptive, encoding='utf-8')
          (res/'mipmap-anydpi-v26/ic_launcher_round.xml').write_text(adaptive, encoding='utf-8')
          splash_xml = '''<?xml version="1.0" encoding="utf-8"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/black"/><item><bitmap android:src="@drawable/tikowiko_splash" android:gravity="center"/></item></layer-list>'''
          (res/'drawable/splash.xml').write_text(splash_xml, encoding='utf-8')
          (res/'drawable-port/splash.xml').write_text(splash_xml, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Tikowikointelligent-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tikowiko-Smart-Assistant-APK
          path: dist/Tikowikointelligent-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create apk-latest dist/Tikowikointelligent-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tikowiko Smart Assistant - APK" --notes "Derniere version APK debug de Tikowiko Smart Assistant."
