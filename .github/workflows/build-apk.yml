name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Installer les composants natifs Tikowiko
        run: |
          mkdir -p android/app/src/main/java/com/tikowiko/intelligent
          mkdir -p android/app/src/main/res/xml
          cp android-plugin/AppLauncherPlugin.java android/app/src/main/java/com/tikowiko/intelligent/AppLauncherPlugin.java
          cp android-plugin/DirectCallPlugin.java android/app/src/main/java/com/tikowiko/intelligent/DirectCallPlugin.java
          cp android-plugin/ClapDetectionService.java android/app/src/main/java/com/tikowiko/intelligent/ClapDetectionService.java
          cp android-plugin/TikowikoVoiceInteractionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionService.java
          cp android-plugin/TikowikoVoiceInteractionSessionService.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSessionService.java
          cp android-plugin/TikowikoVoiceInteractionSession.java android/app/src/main/java/com/tikowiko/intelligent/TikowikoVoiceInteractionSession.java
          cp android-plugin/voice_interaction_service.xml android/app/src/main/res/xml/voice_interaction_service.xml
          cp android-plugin/MainActivity-snippet.java android/app/src/main/java/com/tikowiko/intelligent/MainActivity.java

      - name: Ajouter les permissions et les services Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.CALL_PHONE" />',
              '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + '\n\n    <application', 1)

          clap_service = '''        <service
              android:name=".ClapDetectionService"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="microphone" />\n'''

          if 'android:name=".ClapDetectionService"' not in text:
              text = text.replace('    </application>', clap_service + '    </application>', 1)

          assistant_services = '''        <service
              android:name=".TikowikoVoiceInteractionService"
              android:permission="android.permission.BIND_VOICE_INTERACTION"
              android:exported="true">
              <intent-filter>
                  <action android:name="android.service.voice.VoiceInteractionService" />
              </intent-filter>
              <meta-data
                  android:name="android.voice_interaction"
                  android:resource="@xml/voice_interaction_service" />
          </service>

          <service
              android:name=".TikowikoVoiceInteractionSessionService"
              android:permission="android.permission.BIND_VOICE_INTERACTION"
              android:exported="true"
              android:process=":voice_session" />\n'''

          if 'android:name=".TikowikoVoiceInteractionService"' not in text:
              text = text.replace('    </application>', assistant_services + '    </application>', 1)

          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Installer les visuels Tikowiko sans retouche
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          icon = Path('android-assets/tikowiko-icon.jpg')
          splash = Path('android-assets/tikowiko-splash.jpg')
          if not icon.exists() or not splash.exists():
              raise SystemExit('Les images exactes Tikowiko ne sont pas encore présentes dans android-assets/')

          res = Path('android/app/src/main/res')
          for folder in ['drawable', 'drawable-port', 'mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']:
              (res / folder).mkdir(parents=True, exist_ok=True)

          # Les octets source sont copiés tels quels. Android accepte le contenu JPEG même si
          # l'usage final est une ressource graphique ; aucune retouche de l'image n'est faite ici.
          shutil.copyfile(splash, res / 'drawable-port' / 'splash.jpg')
          shutil.copyfile(splash, res / 'drawable' / 'splash.jpg')
          for folder in ['mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']:
              shutil.copyfile(icon, res / folder / 'ic_launcher.jpg')
              shutil.copyfile(icon, res / folder / 'ic_launcher_round.jpg')
          PY

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Préparer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Tikowikointelligent-debug.apk

      - name: Publier l'APK dans la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create apk-latest \
            dist/Tikowikointelligent-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tikowikointelligent — APK" \
            --notes "Dernière version APK debug de Tikowikointelligent, générée automatiquement par GitHub Actions."
