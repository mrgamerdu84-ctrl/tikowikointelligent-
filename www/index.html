<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tikowikointelligent</title>
<style>
  :root{
    --bg: #12131a;
    --bg-panel: #1b1d27;
    --accent: #6fd6c9;
    --accent-dim: #3a4a48;
    --text: #eef0f4;
    --text-dim: #8a8d9c;
    --danger: #e0665a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column; height:100%;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }
  header{
    padding: 20px 24px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{
    font-size: 19px; font-weight: 600; letter-spacing: 0.2px; margin:0;
  }
  header .status{
    font-size: 12px; color: var(--text-dim);
  }
  main{
    flex:1; overflow-y:auto; padding: 8px 24px 12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height:1.4;
  }
  .bubble.user{
    align-self:flex-end;
    background: var(--accent);
    color: #0b1211;
    border-bottom-right-radius: 4px;
  }
  .bubble.system{
    align-self:flex-start;
    background: var(--bg-panel);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.system.error{
    background: #2a1c1c;
    color: var(--danger);
  }
  footer{
    padding: 14px 24px 22px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #mic{
    width:74px; height:74px; border-radius:50%;
    border:none;
    background: var(--bg-panel);
    color: var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 0 rgba(111,214,201,0.5);
    transition: box-shadow 0.2s ease, background 0.2s ease;
  }
  #mic svg{ width:30px; height:30px; }
  #mic.listening{
    background: var(--accent);
    color:#0b1211;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(111,214,201,0.45); }
    70%{ box-shadow: 0 0 0 18px rgba(111,214,201,0); }
    100%{ box-shadow: 0 0 0 0 rgba(111,214,201,0); }
  }
  #hint{ font-size:12.5px; color:var(--text-dim); }
  #appsBtn{
    position:absolute; top:20px; right:22px;
    background:none; border:none; color:var(--text-dim);
    font-size: 13px; padding:4px;
  }
  #appsPanel{
    position:fixed; inset:0; background: var(--bg);
    display:none; flex-direction:column; z-index:10;
  }
  #appsPanel.open{ display:flex; }
  #appsPanel .top{
    padding: 20px 24px 10px; display:flex; justify-content:space-between; align-items:center;
  }
  #appsPanel .top h2{ font-size:17px; margin:0; }
  #appsPanel .top button{ background:none; border:none; color:var(--accent); font-size:14px; }
  #appsList{ flex:1; overflow-y:auto; padding: 4px 24px 24px; }
  .app-row{
    display:flex; align-items:center; gap:12px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 14.5px;
  }
  .app-row .pkg{ color:var(--text-dim); font-size:11.5px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Tikowikointelligent</h1>
      <div class="status" id="status">Prêt à écouter</div>
    </div>
    <button id="appsBtn" onclick="openAppsPanel()">Applis</button>
  </header>

  <main id="log"></main>

  <footer>
    <div id="hint">Appuie et dis « ouvre » + le nom d'une appli</div>
    <button id="mic" onclick="toggleListening()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
  </footer>
</div>

<div id="appsPanel">
  <div class="top">
    <h2>Applications détectées</h2>
    <button onclick="closeAppsPanel()">Fermer</button>
  </div>
  <div id="appsList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
